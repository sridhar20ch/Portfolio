                <i className={`fas ${icon}`}></i>
              </span>
              <span className="text-slate-700 text-base leading-relaxed pt-1.5">
                {hasTitle ? (
                  <React.Fragment>
                    <strong className="font-bold text-slate-900 mr-2 font-serif">{parts[0]}:</strong>
                    {parts.slice(1).join(':')}
                  </React.Fragment>
                ) : (
                  text
                )}
              </span>
            </li>
          );
        };
        
        const AwardItem = ({ data, icon, colorClass }) => {
          return (
            <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-all">
              <div className="flex gap-4 items-start">
                <span className={`mt-1 text-lg ${colorClass} bg-slate-50 p-2 rounded-full w-10 h-10 flex items-center justify-center shrink-0`}>
                  <i className={`fas ${icon}`}></i>
                </span>
                <div className="flex-grow pt-1.5">
                   <h3 className="font-bold text-slate-900 font-serif text-lg leading-tight mb-2">{data.title}</h3>
                   
                   {data.description && (
                      <p className="text-slate-700 text-sm">{data.description}</p>
                   )}

                   {data.items && data.items.length > 0 && (
                    <ul className="space-y-2 mt-2">
                      {data.items.map((item, idx) => (
                        <li key={idx} className="text-slate-700 text-sm flex gap-2.5 items-start">
                          <i className={`fas fa-circle text-[6px] mt-2 opacity-60 ${colorClass}`}></i>
                          <span>{item}</span>
                        </li>
                      ))}
                    </ul>
                   )}
                </div>
              </div>
            </div>
          );
        };

        const Footer = () => {
          const currentYear = new Date().getFullYear();
          
          return (
            <footer className="bg-white border-t border-slate-200 py-8 mt-auto no-print">
              <div className="container mx-auto px-4 text-center">
                <p className="text-emerald-700 font-serif italic text-lg mb-2">
                  "Selectivity is nature’s signature; catalysis is our attempt to imitate it."
                </p>
                <p className="text-slate-400 text-xs">
                  © {currentYear} All rights reserved.
                </p>
              </div>
            </footer>
          );
        };

        // --- Main App ---

        const App = () => {
          const [activePage, setActivePage] = useState('profile');

          // Scroll to top when page changes
          useEffect(() => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }, [activePage]);

          const renderContent = () => {
            switch(activePage) {
              case 'profile':
                return (
                  <div className="animate-fade-in space-y-12">
                     <Header info={personalInfo} />
                     
                     <div className="max-w-5xl mx-auto space-y-12">
                         {/* Education Section */}
                         <section>
                            <div className="flex items-center gap-3 mb-6 pb-2 border-b border-slate-200">
                                <span className="flex items-center justify-center w-8 h-8 rounded bg-indigo-100 text-academic-blue">
                                    <i className="fas fa-graduation-cap text-sm"></i>
                                </span>
                                <h2 className="text-2xl font-bold text-academic-blue">Education</h2>
                            </div>
                            <div className="space-y-4">
                              {education.map((edu, index) => (
                                <EducationCard key={index} data={edu} />
                              ))}
                            </div>
                         </section>

                         {/* Additional Info Section */}
                         <section>
                           <div className="flex items-center gap-3 mb-6 pb-2 border-b border-slate-200">
                              <span className="flex items-center justify-center w-8 h-8 rounded bg-emerald-100 text-emerald-600">
                                  <i className="fas fa-info-circle text-sm"></i>
                              </span>
                              <h2 className="text-2xl font-bold text-academic-blue">Additional Information</h2>
                           </div>
                           <ul className="space-y-3">
                            {additionalInfo.map((item, index) => (
                              <ListItem key={index} text={item} icon="fa-check" colorClass="text-emerald-600" />
                            ))}
                          </ul>
                         </section>
                     </div>
                  </div>
                );
              
              case 'research':
                return (
                  <div className="animate-fade-in space-y-16">
                     {/* Research Experience */}
                     <section>
                         <div className="flex items-center gap-3 mb-8 pb-4 border-b border-slate-200">
                            <span className="flex items-center justify-center w-12 h-12 rounded-lg bg-indigo-50 text-academic-blue text-xl">
                                <i className="fas fa-flask"></i>
                            </span>
                            <h2 className="text-3xl font-bold text-academic-blue font-serif tracking-tight">Research Experience</h2>
                          </div>
                          <div className="space-y-8">
                            {researchExperience.map((exp, index) => (
                              <ExperienceCard key={index} data={exp} />
                            ))}
                          </div>
                     </section>

                     {/* Research Interests */}
                     <section>
                        <div className="flex items-center gap-3 mb-8 pb-4 border-b border-slate-200">
                            <span className="flex items-center justify-center w-12 h-12 rounded-lg bg-indigo-50 text-academic-blue text-xl">
                                <i className="fas fa-lightbulb"></i>
                            </span>
                            <h2 className="text-3xl font-bold text-academic-blue font-serif tracking-tight">Research Interests</h2>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {researchInterests.map((item, i) => (
                             <div key={i} className="bg-white p-5 rounded-lg border border-slate-200 flex items-center gap-4 shadow-sm hover:shadow-md transition-all">
                               <div className="w-12 h-12 flex items-center justify-center bg-indigo-50 text-academic-blue rounded-full shrink-0 text-lg">
                                 <i className={`fas ${item.icon}`}></i>
                               </div>
                               <span className="font-serif font-medium text-slate-800 text-lg">{item.name}</span>
                             </div>
                          ))}
                        </div>
                    </section>

                     {/* Publications */}
                     <section>
                         <div className="flex items-center gap-3 mb-8 pb-4 border-b border-slate-200">
                            <span className="flex items-center justify-center w-12 h-12 rounded-lg bg-indigo-50 text-academic-blue text-xl">
                                <i className="fas fa-book-open"></i>
                            </span>
                            <h2 className="text-3xl font-bold text-academic-blue font-serif tracking-tight">Publications</h2>
                          </div>
                          <div className="space-y-6">
                            {publications.map((pub, index) => (
                              <PublicationCard key={index} data={pub} />
                            ))}
                          </div>
                     </section>
                  </div>
                );

              case 'skills':
                return (
                  <PageLayout title="Technical Skills" icon="fa-laptop-code">
                    <div className="bg-white p-8 border border-slate-200 rounded-lg shadow-sm">
                        <div className="grid md:grid-cols-2 gap-x-12 gap-y-10">
                          <SkillGroup title="Experimental (Hands-on)" skills={skills.experimental} />
                          <SkillGroup title="Instrumentation (Theoretical)" skills={skills.theoretical} />
                          <div className="md:col-span-2 pt-6 border-t border-slate-100">
                               <SkillGroup title="Computational Expertise" skills={skills.computational} />
                          </div>
                        </div>
                    </div>
                  </PageLayout>
                );

              case 'certifications':
                return (
                  <PageLayout title="Certifications" icon="fa-certificate">
                     <div className="grid md:grid-cols-2 gap-8">
                      <div className="bg-white p-8 border border-slate-200 rounded-lg shadow-sm">
                        <CourseList title="Offline Courses" courses={offlineCourses} />
                      </div>
                      <div className="bg-white p-8 border border-slate-200 rounded-lg shadow-sm">
                         <CourseList title="Online Courses" courses={onlineCourses} />
                      </div>
                    </div>
                  </PageLayout>
                );
              
              case 'conferences':
                return (
                  <PageLayout title="Conferences & Workshops" icon="fa-users">
                    <ul className="space-y-4">
                      {conferences.map((item, index) => (
                        <ListItem key={index} text={item} icon="fa-microphone" colorClass="text-academic-blue" />
                      ))}
                    </ul>
                  </PageLayout>
                );

              case 'awards':
                return (
                  <PageLayout title="Honors & Awards" icon="fa-trophy">
                    <div className="space-y-4">
                      {honorsAndAwards.map((item, index) => (
                        <AwardItem key={index} data={item} icon="fa-medal" colorClass="text-yellow-500" />
                      ))}
                    </div>
                  </PageLayout>
                );
              
              default:
                return null;
            }
          };

          return (
            <div className="min-h-screen flex flex-col bg-slate-50">
              <Navigation activePage={activePage} setActivePage={setActivePage} />
              
              <main className="flex-grow container mx-auto px-4 py-8 max-w-5xl mt-36 md:mt-20">
                {renderContent()}
              </main>

              <Footer />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
